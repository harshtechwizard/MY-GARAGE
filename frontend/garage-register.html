<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register your garage with AutoCare Pro">
    <title>Register Garage - AutoCare Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-md);
        }

        .register-container {
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.6s ease-out;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-xl);
        }

        .register-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .register-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-sm);
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        .register-title {
            font-size: 2rem;
            margin-bottom: var(--spacing-xs);
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        .btn-full {
            width: 100%;
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-lg);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .benefits-box {
            background: rgba(76, 205, 196, 0.1);
            border: 1px solid rgba(76, 205, 196, 0.3);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .benefits-box h3 {
            color: var(--accent-teal);
            font-size: 1rem;
            margin-bottom: var(--spacing-xs);
        }

        .benefits-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .benefits-list li {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            padding: 0.25rem 0;
        }

        .benefits-list li::before {
            content: '✓ ';
            color: var(--accent-teal);
            font-weight: bold;
            margin-right: 0.5rem;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .register-card {
                padding: var(--spacing-lg);
            }
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-container">
            <div class="register-card">
                <div class="register-header">
                    <span class="register-icon">🔧</span>
                    <h1 class="register-title">Register Your Garage</h1>
                    <p class="register-subtitle">Join our network of trusted service providers</p>
                </div>

                <div class="benefits-box">
                    <h3>🌟 Partner Benefits</h3>
                    <ul class="benefits-list">
                        <li>Access to thousands of potential customers</li>
                        <li>Easy booking management system</li>
                        <li>Increase your business visibility</li>
                        <li>Professional dashboard and analytics</li>
                    </ul>
                </div>

                <form id="garageForm">
                    <div class="form-group">
                        <label for="name" class="form-label">🏢 Garage Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            class="form-control" 
                            placeholder="AutoCare Service Center" 
                            required
                            autocomplete="organization"
                        >
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="location" class="form-label">📍 Location</label>
                            <input 
                                type="text" 
                                id="location" 
                                class="form-control" 
                                placeholder="City, State" 
                                required
                                autocomplete="address-level2"
                            >
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">📧 Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                class="form-control" 
                                placeholder="garage@example.com" 
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">🔒 Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="Create a secure password" 
                            required
                            autocomplete="new-password"
                            minlength="6"
                        >
                    </div>

                    <div class="form-group">
                        <label for="services" class="form-label">🛠️ Services Offered</label>
                        <textarea 
                            id="services" 
                            class="form-control" 
                            placeholder="Oil Change, Brake Repair, Engine Diagnostics, Tire Service, AC Repair..." 
                            required
                            rows="3"
                        ></textarea>
                        <small style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem; margin-top: 0.25rem; display: block;">
                            Separate services with commas
                        </small>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-secondary btn-full" id="registerBtn">
                            <span id="btnText">🚀 Register Now</span>
                        </button>
                        <a href="index.html" class="btn btn-outline btn-full">
                            ← Back to Home
                        </a>
                    </div>
                </form>

                <div id="message" style="display: none; margin-top: var(--spacing-md);"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('garageForm');
        const registerBtn = document.getElementById('registerBtn');
        const btnText = document.getElementById('btnText');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Show loading state
            registerBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Registering...';
            messageDiv.style.display = 'none';

            try {
                const response = await fetch('https://my-garage-backend-na1w.onrender.com/api/garages/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        location: document.getElementById('location').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        services: document.getElementById('services').value.split(',').map(s => s.trim())
                    })
                });

                const result = await response.json();
                
                messageDiv.style.display = 'block';
                
                if (response.ok) {
                    messageDiv.className = 'alert alert-success';
                    messageDiv.textContent = '✓ ' + (result.message || 'Garage registered successfully! Redirecting to login...');
                    form.reset();
                    
                    // Store token and redirect to dashboard
                    if (result.token) {
                        localStorage.setItem('authToken', result.token);
                        localStorage.setItem('userType', 'garage');
                        localStorage.setItem('garageId', result.garage.id);
                        localStorage.setItem('garageName', result.garage.name);
                        
                        setTimeout(() => {
                            window.location.href = 'garage-dashboard.html';
                        }, 1500);
                    } else {
                        // Fallback to login page if no token
                        setTimeout(() => {
                            window.location.href = 'garage-login.html';
                        }, 2000);
                    }
                } else {
                    messageDiv.className = 'alert alert-error';
                    messageDiv.textContent = '✗ ' + (result.message || 'Registration failed. Please try again.');
                    
                    // Reset button
                    registerBtn.disabled = false;
                    btnText.textContent = '🚀 Register Now';
                }
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'alert alert-error';
                messageDiv.textContent = '✗ Network error. Please check your connection and try again.';
                
                // Reset button
                registerBtn.disabled = false;
                btnText.textContent = '🚀 Register Now';
            }
        });
    </script>
</body>
</html>
