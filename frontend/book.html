<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book your car service appointment">
    <title>Book Service - AutoCare Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .booking-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-md);
        }

        .booking-container {
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.6s ease-out;
        }

        .booking-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-xl);
        }

        .booking-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .booking-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-sm);
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        .booking-title {
            font-size: 2rem;
            margin-bottom: var(--spacing-xs);
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .booking-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        .btn-full {
            width: 100%;
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-lg);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .info-box {
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid rgba(33, 150, 243, 0.3);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
        }

        .info-box strong {
            color: var(--accent-gold);
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .booking-card {
                padding: var(--spacing-lg);
            }
        }
    </style>
</head>
<body>
    <div class="booking-page">
        <div class="booking-container">
            <div class="booking-card">
                <div class="booking-header">
                    <span class="booking-icon">📅</span>
                    <h1 class="booking-title">Book Your Service</h1>
                    <p class="booking-subtitle">Schedule your car maintenance appointment</p>
                </div>

                <div class="info-box">
                    ℹ️ <strong>Quick Tip:</strong> Have your garage ID ready. You can find it on the garage's profile or contact them directly.
                </div>

                <form id="bookingForm">
                    <div class="form-group">
                        <label for="customerName" class="form-label">👤 Full Name</label>
                        <input 
                            type="text" 
                            id="customerName" 
                            class="form-control" 
                            placeholder="John Doe" 
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="carModel" class="form-label">🚗 Car Model</label>
                            <input 
                                type="text" 
                                id="carModel" 
                                class="form-control" 
                                placeholder="Toyota Camry 2020" 
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="location" class="form-label">📞 Phone Number</label>
                            <input 
                                type="tel" 
                                id="location" 
                                class="form-control" 
                                placeholder="+1 234 567 8900" 
                                required
                                autocomplete="tel"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="garageId" class="form-label">🔧 Garage ID</label>
                        <input 
                            type="text" 
                            id="garageId" 
                            class="form-control" 
                            placeholder="Enter the garage identifier" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="problem" class="form-label">🔍 Service Description</label>
                        <textarea 
                            id="problem" 
                            class="form-control" 
                            placeholder="Describe the service you need (e.g., oil change, brake inspection, engine diagnostics...)" 
                            required
                            rows="4"
                        ></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-full" id="bookBtn">
                            <span id="btnText">🚀 Confirm Booking</span>
                        </button>
                        <a href="index.html" class="btn btn-outline btn-full">
                            ← Back to Home
                        </a>
                    </div>
                </form>

                <div id="message" style="display: none; margin-top: var(--spacing-md);"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('bookingForm');
        const bookBtn = document.getElementById('bookBtn');
        const btnText = document.getElementById('btnText');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Show loading state
            bookBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Processing...';
            messageDiv.style.display = 'none';

            try {
                const response = await fetch('https://my-garage-backend-na1w.onrender.com/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userName: document.getElementById('customerName').value,
                        phone: document.getElementById('location').value,
                        service: document.getElementById('carModel').value,
                        garageId: document.getElementById('garageId').value
                    })
                });

                let result;
                try {
                    result = await response.json();
                } catch (err) {
                    result = { error: 'Server error or invalid response' };
                }
                
                messageDiv.style.display = 'block';
                
                if (response.ok) {
                    messageDiv.className = 'alert alert-success';
                    messageDiv.textContent = '✓ ' + (result.message || 'Booking successful! We will contact you soon.');
                    form.reset();
                    
                    // Reset button after delay
                    setTimeout(() => {
                        bookBtn.disabled = false;
                        btnText.textContent = '🚀 Confirm Booking';
                    }, 2000);
                } else {
                    messageDiv.className = 'alert alert-error';
                    messageDiv.textContent = '✗ ' + (result.message || result.error || 'Booking failed. Please try again.');
                    
                    // Reset button
                    bookBtn.disabled = false;
                    btnText.textContent = '🚀 Confirm Booking';
                }
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'alert alert-error';
                messageDiv.textContent = '✗ Network error. Please check your connection and try again.';
                
                // Reset button
                bookBtn.disabled = false;
                btnText.textContent = '🚀 Confirm Booking';
            }
        });
    </script>
</body>
</html>
