<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Garage owner login">
    <title>Garage Login - AutoCare Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 0.6s ease-out;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-xl);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .login-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-sm);
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        .login-title {
            font-size: 2rem;
            margin-bottom: var(--spacing-xs);
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        .form-footer {
            margin-top: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .divider {
            text-align: center;
            margin: var(--spacing-lg) 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--glass-border);
        }

        .divider span {
            background: var(--glass-bg);
            padding: 0 var(--spacing-sm);
            position: relative;
            color: rgba(255, 255, 255, 0.6);
            font-size:
 0.875rem;
        }

        .btn-full {
            width: 100%;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .text-link {
            text-align: center;
            margin-top: var(--spacing-md);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .text-link a {
            color: var(--accent-teal);
            text-decoration: none;
            font-weight: 600;
        }

        .text-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <span class="login-icon">🔧</span>
                    <h1 class="login-title">Garage Login</h1>
                    <p class="login-subtitle">Access your garage dashboard</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">📧 Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-control" 
                            placeholder="garage@example.com" 
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">🔒 Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="Enter your password" 
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-secondary btn-full" id="loginBtn">
                        <span id="btnText">🚀 Sign In</span>
                    </button>
                </form>

                <div id="message" style="display: none; margin-top: var(--spacing-md);"></div>

                <div class="text-link">
                    Don't have an account? <a href="garage-register.html">Register your garage</a>
                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <div class="form-footer">
                    <a href="index.html" class="btn btn-outline btn-full">
                        ← Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Show loading state
            loginBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Signing in...';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch('https://my-garage-backend-na1w.onrender.com/api/garages/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                
                messageDiv.style.display = 'block';
                
                if (response.ok) {
                    messageDiv.className = 'alert alert-success';
                    messageDiv.textContent = '✓ Login successful! Redirecting...';
                    
                    // Store token and garage info
                    if (result.token) {
                        localStorage.setItem('authToken', result.token);
                        localStorage.setItem('userType', 'garage');
                        localStorage.setItem('garageId', result.garage.id);
                        localStorage.setItem('garageName', result.garage.name);
                    }
                    
                    setTimeout(() => {
                        window.location.href = 'garage-dashboard.html';
                    }, 1500);
                } else {
                    messageDiv.className = 'alert alert-error';
                    messageDiv.textContent = '✗ ' + (result.message || 'Login failed. Please check your credentials.');
                    
                    // Reset button
                    loginBtn.disabled = false;
                    btnText.textContent = '🚀 Sign In';
                }
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'alert alert-error';
                messageDiv.textContent = '✗ Network error. Please check your connection and try again.';
                
                // Reset button
                loginBtn.disabled = false;
                btnText.textContent = '🚀 Sign In';
            }
        });
    </script>
</body>
</html>
