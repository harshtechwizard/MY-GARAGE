<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your AutoCare Pro customer account">
    <title>Customer Sign Up - AutoCare Pro</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="./styles.css">
    
    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 0.6s ease-out;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-xl);
        }

        .register-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .register-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-sm);
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        .register-title {
            font-size: 2rem;
            margin-bottom: var(--spacing-xs);
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        .form-footer {
            margin-top: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .divider {
            text-align: center;
            margin: var(--spacing-lg) 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--glass-border);
        }

        .divider span {
            background: var(--glass-bg);
            padding: 0 var(--spacing-sm);
            position: relative;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
        }

        .btn-full {
            width: 100%;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .text-link {
            text-align: center;
            margin-top: var(--spacing-md);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .text-link a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .text-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-container">
            <div class="register-card">
                <div class="register-header">
                    <span class="register-icon">👤</span>
                    <h1 class="register-title">Create Account</h1>
                    <p class="register-subtitle">Sign up to book car services</p>
                </div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="name" class="form-label">👤 Full Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            class="form-control" 
                            placeholder="John Doe" 
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">📧 Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-control" 
                            placeholder="you@example.com" 
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">🔒 Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="Create a secure password" 
                            required
                            autocomplete="new-password"
                            minlength="6"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                        <span id="btnText">🚀 Create Account</span>
                    </button>
                </form>

                <div id="message" style="display: none; margin-top: var(--spacing-md);"></div>

                <div class="text-link">
                    Already have an account? <a href="login.html">Sign in here</a>
                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <div class="form-footer">
                    <a href="index.html" class="btn btn-outline btn-full">
                        ← Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const btnText = document.getElementById('btnText');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Show loading state
            registerBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> Creating account...';
            messageDiv.style.display = 'none';
            
            try {
                const result = await apiRequest('/api/users/register', {
                    method: 'POST',
                    body: { name, email, password },
                    timeoutMs: 12000
                });
                
                messageDiv.style.display = 'block';
                
                messageDiv.className = 'alert alert-success';
                messageDiv.textContent = '✓ Account created successfully! Redirecting...';
                
                // Store token
                if (result.token) {
                    localStorage.setItem('authToken', result.token);
                    localStorage.setItem('userType', 'user');
                    localStorage.setItem('userName', result.user.name);
                }
                
                setTimeout(() => {
                    window.location.href = 'book.html';
                }, 800);
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'alert alert-error';
                messageDiv.textContent = '✗ ' + (error?.message || 'Network error. Please check your connection and try again.');
                
                // Reset button
                registerBtn.disabled = false;
                btnText.textContent = '🚀 Create Account';
            }
        });
    </script>
</body>
</html>
